[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiyou-beijing-backend"
version = "0.1.0"
description = "智游北京课程项目后端"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.153.0", "starlette==1.3.1", "pydantic==2.11.10", "sqlalchemy==2.0.44",
  "psycopg[binary]==3.2.10", "alembic==1.17.0", "argon2-cffi==25.1.0",
  "uvicorn==0.37.0", "python-dotenv==1.2.4",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires an isolated PostgreSQL database"]
